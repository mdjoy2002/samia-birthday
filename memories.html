                LIGHTBOX
    ====================================== -->

    </div>

    <!-- =====================================
                MUSIC BUTTON
    ====================================== -->

    <button id="musicBtn" class="music-btn">
        🎵
    </button>

    <audio id="bgMusic" loop preload="auto" playsinline>
